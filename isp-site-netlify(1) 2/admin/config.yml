backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/isp-site
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
site_url: https://institutional-signal-press.netlify.app
collections:
- name: content
  label: Site content
  editor:
    preview: false
  files:
  - name: updates
    label: Book updates
    file: data/updates.json
    fields:
    - name: updates
      label: Updates
      label_singular: update
      widget: list
      summary: '{{fields.date}} · {{fields.title}}'
      fields:
      - name: title
        label: Headline
        widget: string
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: MMMM D, YYYY
        time_format: false
      - name: type
        label: Type
        widget: select
        options:
        - News
        - Release
        - Production
        - Event
      - name: book
        label: Book (leave blank for imprint news)
        widget: select
        required: false
        options:
        - who-authorised-this
        - manufactured-value
        - everyone-sells-the-same-ai
        - against-the-better-answer
        - the-agreement-gap
        - when-capital-acts
        - the-ai-choice
      - name: body
        label: Text (blank line between paragraphs)
        widget: text
  - name: books
    label: Books
    file: data/books.json
    fields:
    - name: books
      label: Books
      label_singular: book
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: id
        label: Web address name (no spaces)
        widget: string
      - name: title
        label: Title
        widget: string
      - name: subtitle
        label: Subtitle
        widget: string
        required: false
      - name: status
        label: Status
        widget: string
      - name: release
        label: Release line
        widget: string
        required: false
      - name: question
        label: Central question
        widget: text
      - name: summary
        label: Summary
        widget: text
      - name: cover
        label: Cover
        widget: image
      - name: kindle_url
        label: Kindle store link
        widget: string
        required: false
      - name: paperback_url
        label: Paperback store link
        widget: string
        required: false
      - name: hardcover_url
        label: Hardcover store link
        widget: string
        required: false
  - name: site
    label: Imprint details
    file: data/site.json
    fields:
    - name: imprint_name
      label: Imprint name
      widget: string
    - name: tagline
      label: Tagline
      widget: string
    - name: about
      label: About
      widget: text
    - name: email
      label: Contact email
      widget: string
    - name: author
      label: Author
      widget: string
    - name: location
      label: Footer location
      widget: string
    - name: newsletter_blurb
      label: Newsletter text
      widget: string
