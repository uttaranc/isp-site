<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Institutional Signal Press</title>
<meta name="description" content="Books on authority, capital and judgement in the age of machines that decide.">
<link rel="icon" href="/images/favicon.png">
<style>
:root{--paper:#fbfaf7;--ink:#1c1b19;--muted:#5c5852;--rule:#d9d4ca;--accent:#7a2e1f;--soft:#f3e9e4;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 48px}
header{padding:28px 0 16px;border-bottom:2px solid var(--ink)}header img{display:block;width:min(420px,100%);height:auto}
nav{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}nav a{font:14px var(--sans);color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;padding:2px 0}
nav a.on{font-weight:600;border-color:var(--accent)}
a{color:var(--accent)}section{border-top:1px solid var(--rule);padding:32px 0}section.hero{border:0;padding:40px 0 32px}
h2{font:400 30px/1.2 var(--serif);margin:0 0 8px}.meta{font:13px var(--sans);color:var(--muted)}
.lead{font:400 clamp(26px,5vw,40px)/1.2 var(--serif);margin:0;max-width:760px}.body{font:17px/1.6 var(--serif);max-width:680px}
article{padding:22px 0;border-bottom:1px solid var(--rule)}article h3{font:400 22px/1.3 var(--serif);margin:6px 0 8px}
ol.list{list-style:none;padding:0;margin:0}ol.list li{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
ol.list a{font:19px var(--serif);flex:1;text-decoration:none}
.cover{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:16px}
.card{display:block;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:20px;text-decoration:none;color:var(--ink)}
.card .t{font:21px/1.25 var(--serif);margin:6px 0 4px}.sub{font:italic 15px var(--serif);color:var(--muted)}
.book{display:flex;gap:32px;flex-wrap:wrap;margin-top:16px}.q{font:19px/1.5 var(--serif);border-left:3px solid var(--accent);padding-left:16px;margin:24px 0;max-width:680px}
.btn{display:inline-block;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;font:600 14px var(--sans);text-decoration:none;cursor:pointer}
.ghost{background:transparent;color:var(--accent)}
label{display:block;font:600 13px var(--sans);color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;font:15px var(--sans);color:var(--ink);background:#fff}
.f{margin-bottom:14px}.news{background:var(--soft);padding:28px 24px;border-radius:4px;margin-top:32px;border:0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font:13px var(--sans);color:var(--muted)}
.view{display:none}.view.on{display:block}.hp{display:none}
</style></head><body><div class="wrap">
<header><a href="#/"><img src="/images/logo.png" alt="Institutional Signal Press"></a>
<nav><a href="#/" data-v="home">Home</a><a href="#/books" data-v="books">Books</a><a href="#/updates" data-v="updates">Updates</a><a href="#/contact" data-v="contact">Contact &amp; press</a></nav></header>
<main>
<div class="view" id="v-home"></div><div class="view" id="v-books"></div><div class="view" id="v-book"></div><div class="view" id="v-updates"></div>
<div class="view" id="v-contact"><section><h2>Contact and press</h2>
<p class="body">For review copies, interviews, speaking and rights enquiries, write to <a class="mail" href="#"></a> or use the form below.</p>
<form name="contact" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="company" style="max-width:560px;margin-top:20px">
<input type="hidden" name="form-name" value="contact"><p class="hp"><label>Company <input name="company"></label></p>
<div class="f"><label for="cn">Name</label><input id="cn" name="name" required></div>
<div class="f"><label for="ce">Email</label><input id="ce" name="email" type="email" required></div>
<div class="f"><label for="ct">Topic</label><select id="ct" name="topic"><option>Press</option><option>Review copy</option><option>Speaking</option><option>Rights</option><option>Other</option></select></div>
<div class="f"><label for="cm">Message</label><textarea id="cm" name="message" rows="5" required></textarea></div>
<button class="btn" type="submit">Send message</button></form></section></div>
</main>
<section class="news"><h2 style="font-size:24px">Newsletter</h2><p class="body nlb" style="margin:0 0 14px"></p>
<form name="newsletter" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="company" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
<input type="hidden" name="form-name" value="newsletter"><p class="hp"><input name="company"></p>
<div style="flex:1 1 240px"><label for="nl">Email address</label><input id="nl" name="email" type="email" required></div>
<button class="btn" type="submit">Join</button></form></section>
<footer id="foot"></footer></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
const paras=t=>String(t||'').split(/\n{2,}/).map(p=>`<p class="body" style="margin:0 0 10px">${esc(p)}</p>`).join('');
let S,BK,UP;
const book=id=>BK.find(b=>b.id===id);
const post=p=>{const b=book(p.book);return `<article><div class="meta">${fmt(p.date)} · ${esc(p.type)}${b?` · <a href="#/book/${b.id}">${esc(b.title)}</a>`:''}</div><h3>${esc(p.title)}</h3>${paras(p.body)}</article>`};
const buy=b=>{const L=[['kindle_url','Kindle'],['paperback_url','Paperback'],['hardcover_url','Hardcover']].filter(([k])=>b[k]);
 return `<div style="margin:20px 0">${b.release?`<p class="meta">Release: ${esc(b.release)}</p>`:''}${L.length?`<div style="display:flex;gap:8px;flex-wrap:wrap">${L.map(([k,n])=>`<a class="btn" target="_blank" rel="noopener" href="${esc(b[k])}">Buy ${n}</a>`).join('')}</div>`:'<p class="meta">Not yet on sale. Join the newsletter to hear when it is.</p>'}</div>`};
function render(){
 const [,v='',id]=location.hash.split('/');const view=v||'home';
 document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===(view==='book'?'books':view)));
 if(view==='home')$('#v-home').innerHTML=`<section class="hero"><p class="lead">${esc(S.tagline)}</p><p class="body" style="color:var(--muted);margin-top:16px">${esc(S.about)}</p></section>
  <section><h2>Latest</h2>${UP.slice(0,2).map(post).join('')||'<p class="meta">No updates yet.</p>'}<p style="margin-top:16px"><a class="btn ghost" href="#/updates">All updates</a></p></section>
  <section><h2>The list</h2><ol class="list">${BK.map((b,i)=>`<li><span class="meta" style="width:24px">${i+1}</span><img class="cover" style="width:48px" src="${b.cover}" alt=""><a href="#/book/${b.id}">${esc(b.title)}</a><span class="meta">${esc(b.status)}</span></li>`).join('')}</ol></section>`;
 if(view==='books')$('#v-books').innerHTML=`<section><h2>Books</h2><div class="grid">${BK.map(b=>`<a class="card" href="#/book/${b.id}"><img class="cover" style="width:120px;margin-bottom:14px" src="${b.cover}" alt="Cover of ${esc(b.title)}"><div class="meta">${esc(b.status)}</div><div class="t">${esc(b.title)}</div>${b.subtitle?`<div class="sub">${esc(b.subtitle)}</div>`:''}<p class="body" style="font-size:15px;margin:12px 0 0">${esc(b.question)}</p></a>`).join('')}</div></section>`;
 if(view==='book'){const b=book(id);const mine=UP.filter(p=>p.book===id);$('#v-book').innerHTML=!b?'<section><p class="meta">That book isn\'t in the catalogue.</p></section>':
  `<section style="border:0"><a href="#/books" style="font:14px var(--sans)">← All books</a><div class="book"><div style="width:220px"><img class="cover" src="${b.cover}" alt="Cover of ${esc(b.title)}"></div><div style="flex:1 1 320px">
  <h2 style="font-size:36px">${esc(b.title)}</h2>${b.subtitle?`<p class="sub" style="font-size:20px;margin:0">${esc(b.subtitle)}</p>`:''}<p class="meta" style="margin-top:12px">Status: ${esc(b.status)}</p>${buy(b)}<p class="q">${esc(b.question)}</p><p class="body">${esc(b.summary)}</p></div></div></section>
  <section><h3 style="font:400 22px var(--serif);margin:0">Updates on this book</h3>${mine.map(post).join('')||'<p class="meta">No updates posted for this book yet.</p>'}</section>`;document.title=(b?b.title+' · ':'')+S.imprint_name}
 else document.title=S.imprint_name;
 if(view==='updates')$('#v-updates').innerHTML=`<section><h2>Updates</h2><div style="max-width:320px;margin:12px 0 4px"><label for="flt">Show updates for</label><select id="flt"><option value="">All books and imprint news</option>${BK.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select></div><div id="feed"></div></section>`;
 if(view==='updates'){const f=()=>{const v=$('#flt').value;$('#feed').innerHTML=UP.filter(p=>!v||p.book===v).map(post).join('')||'<p class="meta">No updates for this book yet.</p>'};$('#flt').onchange=f;f()}
 ($('#v-'+view)||$('#v-home')).classList.add('on');window.scrollTo(0,0);
}
Promise.all(['site','books','updates'].map(n=>fetch('/data/'+n+'.json').then(r=>r.json()))).then(([s,b,u])=>{
 S=s;BK=b.books||[];UP=(u.updates||[]).slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)));
 document.querySelectorAll('.mail').forEach(a=>{a.href='mailto:'+S.email;a.textContent=S.email});$('.nlb').textContent=S.newsletter_blurb;
 $('#foot').textContent=`© ${new Date().getFullYear()} ${S.imprint_name}. ${S.location||''}`;render()}).catch(()=>{$('#v-home').innerHTML='<section><p class="meta">The site content could not be loaded. Please refresh the page.</p></section>';$('#v-home').classList.add('on')});
addEventListener('hashchange',render);
</script></body></html>
